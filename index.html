    <!-- First-run shell: paints the welcome dialog's text from plain HTML so first paint/LCP does not wait for the JS bundle.

    <script>(function(){try{

    <!-- Returning-user shell: static app chrome (header, sidebar, tabs, "what to watch today" heading, skeleton cards) so first paint

}catch(e){}})();</script>
