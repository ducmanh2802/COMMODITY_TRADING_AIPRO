    <!-- First-run shell: paints the welcome dialog's text from plain HTML so first paint/LCP does not wait for the JS bundle.
         Mirrors src/components/common/OnboardingTour.tsx step 1 (same classes, so React replaces it without layout shift).
         Inert and aria-hidden; React's createRoot().render() replaces it. Skipped for returning users and ?autostart=1. -->
    <script>(function(){try{
var d=document,l=localStorage,r=d.getElementById("root");
if(l.getItem("ctap.onboardingDone")==="1"||/[?&]autostart=1/.test(location.search))return;

var S=en?{step:"Step 1/5",title:"Choose a theme",body:"Dark is easy on the eyes for long sessions; light reads well outdoors. Change it any time at the top.",dark:"Dark",light:"Light",skip:"Skip",next:"Next"}:{step:"Bước 1/5",title:"Chọn màu nền",body:"Nền tối dịu mắt khi xem lâu; nền sáng dễ đọc ngoài trời. Đổi lại bất cứ lúc nào ở góc trên.",dark:"Nền tối",light:"Nền sáng",skip:"Bỏ qua",next:"Tiếp theo"};
var b="px-5 py-3 rounded-xl border text-lg font-semibold min-h-[52px]",on=" bg-[var(--accent)] border-[var(--accent)]",off=" border-[var(--accent-text)]";
r.innerHTML='<div aria-hidden="true" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-black/70 p-4"><div class="w-full max-w-lg rounded-2xl border border-[var(--accent)] bg-[var(--bg)] p-6 text-[var(--text-strong)] shadow-2xl"><div class="text-base text-[var(--accent-text)]">'+S.step+'</div><h2 class="mt-2 text-3xl font-bold">'+S.title+'</h2><p class="mt-3 text-xl leading-relaxed" style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">'+S.body+'</p><div class="mt-5 flex flex-wrap gap-3"><div class="'+b+(light?off:on)+'">'+S.dark+'</div><div class="'+b+(light?on:off)+'">'+S.light+'</div></div><div class="mt-6 flex items-center justify-between"><span class="text-lg underline text-[var(--muted)] px-2 py-2">'+S.skip+'</span><div class="'+b+on+'">'+S.next+'</div></div></div></div>';window.__ctapShell=1;
